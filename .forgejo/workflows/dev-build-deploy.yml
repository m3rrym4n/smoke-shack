name: Dev Build and Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-stack-dev-deploy
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t 192.168.1.73:5050/smoke-stack/smoke-stack:job1-${{ github.sha }} .
      - name: Dockhand deploy placeholder
        run: |
          echo "TODO: authenticate to Zot, push the immutable image, rewrite compose.yml,"
          echo "and trigger Dockhand using the documented registry and Dockhand secrets."
