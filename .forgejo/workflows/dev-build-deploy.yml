name: Dev Build and Deploy

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-stack-dev-deploy
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install quality tooling (uv-managed Python 3.12)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.15/install.sh | sh
          "$HOME/.local/bin/uv" venv --python 3.12 .quality-venv
          "$HOME/.local/bin/uv" pip install --python .quality-venv/bin/python -e '.[dev]'
      - name: Ruff
        run: .quality-venv/bin/ruff check .
      - name: Mypy
        run: .quality-venv/bin/mypy app
      - name: Pytest
        run: .quality-venv/bin/pytest

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t 192.168.1.73:5050/smoke-stack/smoke-stack:job1-${{ github.sha }} .
      - name: Dockhand deploy placeholder
        run: |
          echo "TODO: authenticate to Zot, push the immutable image, rewrite compose.yml,"
          echo "and trigger Dockhand using the documented registry and Dockhand secrets."
