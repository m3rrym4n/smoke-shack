name: Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-stack-main-release
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan
        run: |
          gitleaks_archive="$(mktemp)"
          gitleaks_dir="$(mktemp -d)"
          trap 'rm -f "$gitleaks_archive"; rm -rf "$gitleaks_dir"' EXIT
          curl -fsSL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            -o "$gitleaks_archive"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $gitleaks_archive" | sha256sum -c -
          tar -xzf "$gitleaks_archive" -C "$gitleaks_dir" gitleaks
          "$gitleaks_dir/gitleaks" detect --source . --redact --verbose --exit-code 1

  release:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Refuse release from non-main branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Refusing release from ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install quality tooling (uv-managed Python 3.12)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.15/install.sh | sh
          "$HOME/.local/bin/uv" venv --python 3.12 .quality-venv
          "$HOME/.local/bin/uv" pip install --python .quality-venv/bin/python -e '.[dev]'
      - name: Verify
        run: |
          .quality-venv/bin/ruff check .
          .quality-venv/bin/mypy app
          .quality-venv/bin/pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release tooling
        run: npm ci
      - name: Compute and tag release
        env:
          GIT_AUTHOR_NAME: smoke-stack-ci
          GIT_AUTHOR_EMAIL: ci@smoke-stack.local
          GIT_COMMITTER_NAME: smoke-stack-ci
          GIT_COMMITTER_EMAIL: ci@smoke-stack.local
        run: npm run release
      - name: Create Forgejo release
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          FORGEJO_SERVER_URL: ${{ github.server_url }}
          FORGEJO_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          while IFS= read -r tag; do
            release_url="${FORGEJO_SERVER_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases/tags/${tag}"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header 'Accept: application/json' \
              "$release_url")"

            if [ "$status" = "200" ]; then
              echo "Forgejo release ${tag} already exists; nothing to do."
              continue
            fi
            if [ "$status" != "404" ]; then
              echo "Failed to check for Forgejo release ${tag}: HTTP ${status}" >&2
              cat "$response_file" >&2
              exit 1
            fi

            version="${tag#v}"
            body="$(awk -v version="$version" '
              /^# / || /^## / {
                heading = $0
                sub(/^##? /, "", heading)
                sub(/^\[/, "", heading)
                if (found) exit
                suffix = substr(heading, length(version) + 1, 1)
                if (heading == version || (index(heading, version) == 1 && \
                    (suffix == " " || suffix == "]" || suffix == "("))) found = 1
              }
              found { print }
            ' CHANGELOG.md)"
            if [ -z "$body" ]; then
              body="Release ${tag}."
            fi

            payload="$(TAG="$tag" BODY="$body" node -e '
              process.stdout.write(JSON.stringify({
                tag_name: process.env.TAG,
                name: process.env.TAG,
                prerelease: false,
                body: process.env.BODY,
              }));
            ')"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: token ${FORGEJO_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "${FORGEJO_SERVER_URL}/api/v1/repos/${FORGEJO_REPOSITORY}/releases")"

            if [ "$status" != "201" ]; then
              echo "Failed to create Forgejo release ${tag}: HTTP ${status}" >&2
              cat "$response_file" >&2
              exit 1
            fi
            echo "Created Forgejo release ${tag}."
          done < <(git tag --list 'v[0-9]*' --sort=version:refname | awk 'index($0, "-") == 0')

  publish-image:
    needs: release
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find stable release at latest main
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git checkout --force main
          git reset --hard origin/main

          stable_tag="$(
            git tag --points-at HEAD --list 'v[0-9]*' |
              awk 'index($0, "-") == 0' |
              sort -V |
              tail -n 1
          )"
          if [ -z "$stable_tag" ]; then
            echo "no stable release at HEAD, nothing to publish"
            echo "PUBLISH_IMAGE=false" >> "$GITHUB_ENV"
            exit 0
          fi

          version="${stable_tag#v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "PUBLISH_IMAGE=true" >> "$GITHUB_ENV"
      - name: Install Docker CLI
        if: env.PUBLISH_IMAGE == 'true'
        run: apt-get update && apt-get install -y docker.io
      - name: Log in to Docker Hub
        if: env.PUBLISH_IMAGE == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Skip image build when version is already published
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          if docker manifest inspect "m3rrym4n/smoke-shack:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "m3rrym4n/smoke-shack:${RELEASE_VERSION} is already published; nothing to do"
            echo "PUBLISH_IMAGE=false" >> "$GITHUB_ENV"
          fi
      - name: Prepare build info
        if: env.PUBLISH_IMAGE == 'true'
        run: printf '%s\n' "$RELEASE_VERSION" > app/build_info.txt
      - name: Build image
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          revision="$(git rev-parse HEAD)"
          docker build \
            --label org.opencontainers.image.source=https://github.com/m3rrym4n/smoke-shack \
            --label "org.opencontainers.image.version=${RELEASE_VERSION}" \
            --label "org.opencontainers.image.revision=${revision}" \
            --label org.opencontainers.image.licenses=MIT \
            --tag "m3rrym4n/smoke-shack:${RELEASE_VERSION}" \
            --tag m3rrym4n/smoke-shack:latest \
            --tag "192.168.1.73:5050/smoke-shack/smoke-shack:${RELEASE_VERSION}" \
            .
      - name: Trivy container scan
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            "m3rrym4n/smoke-shack:${RELEASE_VERSION}"
      - name: Push images
        if: env.PUBLISH_IMAGE == 'true'
        run: |
          docker push "m3rrym4n/smoke-shack:${RELEASE_VERSION}"
          docker push "192.168.1.73:5050/smoke-shack/smoke-shack:${RELEASE_VERSION}"
          docker push m3rrym4n/smoke-shack:latest
      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io || true
