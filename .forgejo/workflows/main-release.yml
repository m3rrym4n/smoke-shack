name: Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-stack-main-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse release from non-main branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Refusing release from ${{ github.ref_name }}"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install quality tooling (uv-managed Python 3.12)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.15/install.sh | sh
          "$HOME/.local/bin/uv" venv --python 3.12 .quality-venv
          "$HOME/.local/bin/uv" pip install --python .quality-venv/bin/python -e '.[dev]'
      - name: Verify
        run: |
          .quality-venv/bin/ruff check .
          .quality-venv/bin/mypy app
          .quality-venv/bin/pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release tooling
        run: npm ci
      - name: Compute and tag release
        env:
          GIT_AUTHOR_NAME: smoke-stack-ci
          GIT_AUTHOR_EMAIL: ci@smoke-stack.local
          GIT_COMMITTER_NAME: smoke-stack-ci
          GIT_COMMITTER_EMAIL: ci@smoke-stack.local
        run: npm run release
