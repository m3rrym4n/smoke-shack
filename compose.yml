services:
  smoke-stack:
    image: 192.168.1.73:5050/smoke-stack/smoke-stack:dev-47110f3
    container_name: smoke-stack-dev
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      HA_URL: ${HA_URL}
      HA_TOKEN: ${HA_TOKEN}
      HA_WS_MAX_SIZE_BYTES: ${HA_WS_MAX_SIZE_BYTES:-67108864}
      DATABASE_PATH: /data/smoke-stack.db
      PHOTO_DIR: /data/photos
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-10}
      TZ: America/Los_Angeles
    volumes:
      - smoke-stack-dev-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  smoke-stack-dev-data:
